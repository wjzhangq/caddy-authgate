name: build

on:
  push:
    branches: [main]
    # 仅 vX.Y.Z 形式的 tag（如 v1.0.1）触发发布
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:
  workflow_dispatch:
    inputs:
      caddy_version:
        description: 'Caddy 版本，留空为最新版'
        required: false
        default: ''

permissions:
  contents: read

env:
  MODULE: github.com/wjzhangq/caddy-authgate
  CADDY_VERSION: ${{ github.event.inputs.caddy_version }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5

      - name: Unit & integration tests
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage
        run: go tool cover -func=coverage.out | tail -n 1

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64, ext: .exe }
          - { goos: windows, goarch: arm64, ext: .exe }
    env:
      BIN: caddy-authgate-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install xcaddy
        run: go install github.com/caddyserver/xcaddy/cmd/xcaddy@latest

      - name: Build caddy with authgate
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          xcaddy build --with ${MODULE}=. --output dist/${BIN}

      - name: Verify module
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          ./dist/${BIN} version
          ./dist/${BIN} list-modules | grep -x 'http.handlers.authgate'

      - name: E2E
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: ./scripts/e2e.sh dist/${BIN}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN }}
          path: dist/${{ env.BIN }}
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          chmod +x caddy-authgate-linux-* caddy-authgate-darwin-*
          sha256sum caddy-authgate-* > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
